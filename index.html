<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo Cáo Tiến Độ Sửa Chữa Máy Móc / 设备维修进度汇报</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 15px; background-color: #f4f6f9; }
        h2 { text-align: center; color: #1a365d; margin-bottom: 5px; }
        h3 { text-align: center; color: #4a5568; margin-top: 0; font-weight: normal; }
        .form-container { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .form-group { margin-bottom: 10px; }
        label { font-weight: bold; display: block; margin-bottom: 3px; font-size: 14px; }
        input, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        textarea { resize: vertical; height: 60px; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button { flex: 1; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; }
        .btn-add { background-color: #2b6cb0; }
        .btn-download { background-color: #2f855a; }
        
        #report-area { background: white; padding: 15px; border-radius: 8px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { border: 1px solid #cbd5e0; padding: 8px; text-align: left; vertical-align: top; }
        th { background-color: #edf2f7; color: #2d3748; text-align: center; }
        .completed { background-color: #c6f6d5 !important; }
        .cn-text { color: #c53030; display: block; font-weight: bold; margin-top: 3px; }
        .action-btns { display: flex; gap: 4px; }
        .btn-sm { padding: 4px 8px; font-size: 12px; border-radius: 3px; }
        .btn-complete { background-color: #38a169; }
        .btn-edit { background-color: #d69e2e; }
        .btn-delete { background-color: #e53e3e; }
    </style>
</head>
<body>

    <h2>BÁO CÁO TIẾN ĐỘ SỬA CHỮA MÁY MÓC</h2>
    <h3>设备维修进度汇报</h3>

    <div class="form-container">
        <div class="form-group">
            <label>Tên Máy / 设备名称:</label>
            <input type="text" id="machine" placeholder="Nhập tên máy...">
        </div>
        <div class="form-group">
            <label>Nội Dung Sửa Chữa / 维修内容:</label>
            <textarea id="content" placeholder="Nhập nội dung hư hỏng, sự cố..."></textarea>
        </div>
        <div class="form-group">
            <label>Giải Pháp + Quy Cách Linh Kiện / 解决方案+零件规格:</label>
            <textarea id="solution" placeholder="Nhập phương án và quy cách linh kiện..."></textarea>
        </div>
        <div class="form-group">
            <label>Thời Gian Dự Kiến Hoàn Thành / 预计完成时间:</label>
            <input type="text" id="estimate" placeholder="Ví dụ: 2 giờ, 17:00 ngày 03/09...">
        </div>
        <div class="btn-group">
            <button class="btn-add" onclick="addOrUpdateRow()">Thêm Báo Cáo / 添加汇报</button>
            <button class="btn-download" onclick="downloadImage()">Tải Tải Hình Báo Cáo / 下载图片</button>
        </div>
    </div>

    <div id="report-area">
        <h3 style="text-align: center; margin-bottom: 10px;">BẢNG TIẾN ĐỘ SỬA CHỮA / 维修进度表</h3>
        <table>
            <thead>
                <tr>
                    <th style="width: 40px;">STT<br>序号</th>
                    <th style="width: 100px;">Máy<br>设备</th>
                    <th style="width: 110px;">Thời Gian Bắt Đầu<br>开始时间</th>
                    <th>Nội Dung<br>内容</th>
                    <th>Giải Pháp + Linh Kiện<br>解决方案+规格</th>
                    <th style="width: 110px;">Thời Gian Dự Kiến<br>预计时间</th>
                    <th class="no-print" style="width: 110px;">Thao Tác<br>操作</th>
                </tr>
            </thead>
            <tbody id="table-body">
            </tbody>
        </table>
    </div>

    <script>
        let editIndex = null;

        async function translateText(text) {
            if (!text.trim()) return '';
            try {
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=vi&tl=zh-CN&dt=t&q=${encodeURIComponent(text)}`);
                const data = await res.json();
                return data[0].map(item => item[0]).join('');
            } catch (e) {
                return '';
            }
        }

        async function addOrUpdateRow() {
            const machine = document.getElementById('machine').value;
            const content = document.getElementById('content').value;
            const solution = document.getElementById('solution').value;
            const estimate = document.getElementById('estimate').value;

            if (!machine || !content) {
                alert('Vui lòng nhập Tên máy và Nội dung!');
                return;
            }

            const machineCn = await translateText(machine);
            const contentCn = await translateText(content);
            const solutionCn = await translateText(solution);
            const estimateCn = await translateText(estimate);

            const now = new Date();
            const timeStr = now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) + ' ' + now.toLocaleDateString('vi-VN');

            let reports = JSON.parse(localStorage.getItem('repair_reports') || '[]');

            if (editIndex !== null) {
                reports[editIndex] = {
                    ...reports[editIndex],
                    machine, machineCn,
                    content, contentCn,
                    solution, solutionCn,
                    estimate, estimateCn
                };
                editIndex = null;
            } else {
                reports.push({
                    startTime: timeStr,
                    machine, machineCn,
                    content, contentCn,
                    solution, solutionCn,
                    estimate, estimateCn,
                    completed: false
                });
            }

            localStorage.setItem('repair_reports', JSON.stringify(reports));
            clearInputs();
            renderTable();
        }

        function renderTable() {
            const reports = JSON.parse(localStorage.getItem('repair_reports') || '[]');
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            reports.forEach((item, index) => {
                const tr = document.createElement('tr');
                if (item.completed) tr.classList.add('completed');

                tr.innerHTML = `
                    <td style="text-align:center;">${index + 1}</td>
                    <td><b>${item.machine}</b><span class="cn-text">${item.machineCn}</span></td>
                    <td style="font-size: 11px;">${item.startTime}</td>
                    <td>${item.content.replace(/\n/g, '<br>')}<span class="cn-text">${item.contentCn.replace(/\n/g, '<br>')}</span></td>
                    <td>${item.solution.replace(/\n/g, '<br>')}<span class="cn-text">${item.solutionCn.replace(/\n/g, '<br>')}</span></td>
                    <td>${item.estimate}<span class="cn-text">${item.estimateCn}</span></td>
                    <td class="no-print">
                        <div class="action-btns">
                            <button class="btn-sm btn-complete" onclick="markComplete(${index})">✓</button>
                            <button class="btn-sm btn-edit" onclick="editRow(${index})">Sửa</button>
                            <button class="btn-sm btn-delete" onclick="deleteRow(${index})">Xóa</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function markComplete(index) {
            const pwd = prompt('Nhập mật khẩu để xác nhận hoàn thành:');
            if (pwd === '230') {
                let reports = JSON.parse(localStorage.getItem('repair_reports') || '[]');
                reports[index].completed = !reports[index].completed;
                localStorage.setItem('repair_reports', JSON.stringify(reports));
                renderTable();
            } else if (pwd !== null) {
                alert('Mật khẩu không đúng!');
            }
        }

        function editRow(index) {
            let reports = JSON.parse(localStorage.getItem('repair_reports') || '[]');
            const item = reports[index];
            document.getElementById('machine').value = item.machine;
            document.getElementById('content').value = item.content;
            document.getElementById('solution').value = item.solution;
            document.getElementById('estimate').value = item.estimate;
            editIndex = index;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteRow(index) {
            if (confirm('Bạn có chắc chắn muốn xóa dòng này?')) {
                let reports = JSON.parse(localStorage.getItem('repair_reports') || '[]');
                reports.splice(index, 1);
                localStorage.setItem('repair_reports', JSON.stringify(reports));
                renderTable();
            }
        }

        function clearInputs() {
            document.getElementById('machine').value = '';
            document.getElementById('content').value = '';
            document.getElementById('solution').value = '';
            document.getElementById('estimate').value = '';
        }

        function downloadImage() {
            const reportArea = document.getElementById('report-area');
            const noPrintElements = document.querySelectorAll('.no-print');
            
            noPrintElements.forEach(el => el.style.display = 'none');

            html2canvas(reportArea, { scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Bao_Cao_Tien_Do_Sua_Chua_${new Date().toISOString().slice(0,10)}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                noPrintElements.forEach(el => el.style.display = '');
            });
        }

        window.onload = renderTable;
    </script>
</body>
</html>
