<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://sndzaqqrxoqlzemgboy.supabase.co';
    // Dán mã anon key vừa copy ở Bước 1 vào giữa hai dấu ngoặc đơn dưới đây:
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNuZHphcXFxcnhvcWx6ZW1nYm95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMDM1MDMsImV4cCI6MjEwMzY3OTUwM30.N-7hXggITi6yM8VZPtDMWehb1_i1IsR6P5vDMQ6-hJg';

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let editId = null;

    async function loadReports() {
        try {
            const { data, error } = await client.from('reports').select('*').order('id', { ascending: true });
            if (error) {
                console.error("Lỗi Supabase:", error);
            } else {
                renderTable(data || []);
            }
        } catch (e) {
            console.error("Lỗi kết nối:", e);
        }
    }

    async function addOrUpdateRow() {
        const machine = document.getElementById('machine').value;
        const content = document.getElementById('content').value;
        const solution = document.getElementById('solution').value;
        const estimate = document.getElementById('estimate').value;

        if (!machine || !content) {
            alert('Vui lòng nhập Tên máy và Nội dung sửa chữa!');
            return;
        }

        const btn = document.getElementById('btn-submit');
        btn.innerText = 'Đang lưu... / 正在保存...';

        const now = new Date();
        const dateStr = now.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
        const timeStr = now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
        const fullTimeStr = `${timeStr} ${dateStr}`;

        try {
            let resError;
            if (editId !== null) {
                const { error } = await client.from('reports').update({ machine, content, solution, estimate }).eq('id', editId);
                resError = error;
                editId = null;
            } else {
                const { error } = await client.from('reports').insert([{ start_time: fullTimeStr, machine, content, solution, estimate, completed: false }]);
                resError = error;
            }

            if (resError) {
                alert("Lỗi lưu Supabase: " + resError.message);
            } else {
                clearInputs();
                await loadReports();
            }
        } catch (err) {
            alert("Lỗi kết nối: " + err.message);
        }

        btn.innerText = 'Thêm Báo Cáo / 添加汇报';
    }

    function renderTable(reports) {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';
        reports.forEach((item, index) => {
            const tr = document.createElement('tr');
            if (item.completed) tr.classList.add('completed');
            tr.innerHTML = `
                <td style="text-align:center; font-weight:bold;">${index + 1}</td>
                <td><b class="${item.completed ? 'completed-text' : ''}">${item.machine || ''}</b>${item.completed ? '<br><small class="completed-text">Hoàn thành / 已完成</small>' : ''}</td>
                <td style="font-size: 11px; text-align:center;">${item.start_time || ''}</td>
                <td>${(item.content || '').replace(/\n/g, '<br>')}</td>
                <td>${(item.solution || '').replace(/\n/g, '<br>')}</td>
                <td>${item.estimate || ''}</td>
                <td class="no-print">
                    <div class="action-btns">
                        <button class="btn-sm btn-complete" onclick="markComplete(${item.id})">✓</button>
                        <button class="btn-sm btn-edit" onclick="editRow(${item.id})">Sửa</button>
                        <button class="btn-sm btn-delete" onclick="deleteRow(${item.id})">Xóa</button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function markComplete(id) {
        if (prompt('Nhập mật khẩu (230):') === '230') {
            await client.from('reports').update({ completed: true }).eq('id', id);
            loadReports();
        }
    }

    async function editRow(id) {
        const { data } = await client.from('reports').select('*').eq('id', id).single();
        if (data) {
            document.getElementById('machine').value = data.machine || '';
            document.getElementById('content').value = data.content || '';
            document.getElementById('solution').value = data.solution || '';
            document.getElementById('estimate').value = data.estimate || '';
            editId = id;
        }
    }

    async function deleteRow(id) {
        if (confirm('Xóa dòng này?')) {
            await client.from('reports').delete().eq('id', id);
            loadReports();
        }
    }

    function clearInputs() {
        document.getElementById('machine').value = '';
        document.getElementById('content').value = '';
        document.getElementById('solution').value = '';
        document.getElementById('estimate').value = '';
    }

    function downloadImage() {
        const reportArea = document.getElementById('report-area');
        const noPrintElements = document.querySelectorAll('.no-print');
        noPrintElements.forEach(el => el.style.display = 'none');
        html2canvas(reportArea, { scale: 2, useCORS: true }).then(canvas => {
            const link = document.createElement('a');
            link.download = `Bao_Cao_Repair.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            noPrintElements.forEach(el => el.style.display = '');
        });
    }

    window.onload = function() {
        loadReports();
        setInterval(loadReports, 3000);
    };
</script>
